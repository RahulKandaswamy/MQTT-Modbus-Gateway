; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; All platform and library versions are pinned so that every build (local and
; CI) produces the same firmware. Bump them deliberately, in their own commit.

[platformio]
default_envs = esp32-s3-relay-1ch

[env:esp32-s3-relay-1ch]
platform = platformio/espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; USE LITTLEFS INSTEAD OF SPIFFS
board_build.filesystem = littlefs

; Flash & PSRAM Settings for Waveshare ESP32-S3R8
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv

; CRITICAL: Tell PlatformIO that PSRAM is Octal (OPI) for the S3R8 chip
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; USB CDC & PSRAM Flags
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; dependencies (pinned: tag or exact commit)
lib_ldf_mode = deep
lib_deps =
    https://github.com/eModbus/eModbus.git#v1.7.6.stable
    https://github.com/theelims/PsychicMqttClient.git#4bc0336d1ecbc0e778f93e033c65273388204180
    https://github.com/hoeken/PsychicHttp.git#3.1.2
    bblanchon/ArduinoJson @ 7.4.3

; Host-side unit tests for hardware-independent code (pio test -e native).
; Only sources listed in build_src_filter are compiled, so anything tested here
; must not include Arduino/ESP-IDF headers.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<modbus_codec.cpp>
build_flags = -std=gnu++17 -Wall -Wextra
